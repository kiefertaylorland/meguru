name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@5a5d4797870f25f26609afed2fb4b0a4a0c88af4 # v6
      - uses: actions/setup-go@d60b41a563a30eac31c3ec623e6ff0a3c7a23c01 # v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@4afd733fb0b5e7f00e50f09471150a8ef0a53e1c # v9
        with:
          version: v2.12

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: golang/govulncheck-action@b625fbe08f3bccbe446d94fbf87fcc875a4f50ee # v1
        with:
          go-version-file: go.mod
          go-package: ./...
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@5a5d4797870f25f26609afed2fb4b0a4a0c88af4 # v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is not required for personal accounts.

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@5a5d4797870f25f26609afed2fb4b0a4a0c88af4 # v6
      - uses: actions/setup-go@d60b41a563a30eac31c3ec623e6ff0a3c7a23c01 # v6
        with:
          go-version-file: go.mod
      - run: ./scripts/coverage.sh

  network-denied:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod
      - name: Pre-download test dependencies (network still available)
        run: go build -tags networkdenied ./tests/e2e/...
      - name: Run core loop with network access blocked
        run: |
          sudo unshare --net --setgid "$(id -g)" --setuid "$(id -u)" \
            env HOME="$HOME" GOPATH="$(go env GOPATH)" GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)" PATH="$PATH" \
            go test -tags networkdenied ./tests/e2e/...
